name: Озвучка слов
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
concurrency:
  group: voice
  cancel-in-progress: false
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Записать новые слова
        run: python voice_worker.py
        env:
          FAM: ${{ secrets.FAM }}
          AZURE_KEY: ${{ secrets.AZURE_KEY }}
          AZURE_REGION: germanywestcentral
